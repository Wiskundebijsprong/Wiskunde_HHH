<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reële getallen</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--blue:#3157d5;--line:#dfe5f1;--green:#16845b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#243f9d,#5272e8);color:#fff;padding:44px 20px}.wrap,main{max-width:1000px;margin:auto}
.eyebrow{font-weight:750;opacity:.88}.subtitle{max-width:760px;line-height:1.55}h1{font-size:clamp(32px,6vw,52px);margin:5px 0 10px}
main{padding:28px 18px 60px}.intro,.card p{color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 5px 20px #2030600c}.card h2{margin:10px 0 7px}
.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:.82rem;font-weight:750;background:#edf8f3;color:var(--green)}
.soon{background:#f2f4f7;color:#667085}.btn{display:inline-block;text-decoration:none;background:var(--blue);color:#fff;font-weight:750;padding:11px 15px;border-radius:10px;margin-top:5px}
.secondary{background:#e9edfa;color:#203a92}.disabled{display:inline-block;background:#eef0f4;color:#89909d;font-weight:700;padding:11px 15px;border-radius:10px;margin-top:5px}
.num{font-size:.85rem;font-weight:800;color:var(--blue)}.crumb{margin-bottom:20px}.crumb a{color:var(--blue);text-decoration:none;font-weight:750}
footer{text-align:center;color:var(--muted);padding:18px}
</style></head>
<body><header><div class="wrap"><div class="eyebrow">Wiskunde 3 HHH</div><h1>Reële getallen</h1></div></header><main><div class="crumb"><a href="../">← Terug naar Wiskunde 3</a></div><section class="card"><span class="tag soon">Binnenkort</span><h2>Dit hoofdstuk bouwen we later uit</h2><p>De map en startpagina zijn al voorbereid.</p></section></main></body></html>
